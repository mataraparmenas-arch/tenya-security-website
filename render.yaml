# Render Blueprint — one-click free deploy of the whole stack.
# Dashboard ➜ Blueprints ➜ New Blueprint ➜ point at this repo.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---- Django REST API (free web service) ----
  - type: web
    name: sacco-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # start-server-prod.sh runs migrate + collectstatic (+ first-admin bootstrap), then gunicorn
    startCommand: bash start-server-prod.sh
    healthCheckPath: /admin/login/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: sacco-db
          property: connectionString
      - key: CREATE_DEFAULT_ADMIN
        value: "true"
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: MPESA_ENVIRONMENT
        value: sandbox
      # After first deploy, set these in the dashboard, then flip CREATE_DEFAULT_ADMIN=false:
      # - key: DJANGO_SUPERUSER_PASSWORD   (required on first boot to create the admin)
      # - key: DJANGO_ALLOWED_HOSTS        e.g. sacco-api.onrender.com
      # - key: CORS_EXTRA_ORIGINS          e.g. https://sacco-web.vercel.app
      # - key: MPESA_CONSUMER_KEY  / MPESA_CONSUMER_SECRET / MPESA_SHORTCODE / MPESA_PASSKEY
      # - key: MPESA_CALLBACK_URL          e.g. https://sacco-api.onrender.com/api/v1/payments/mpesa/callback/

  # ---- React frontend (free static site) ----
  - type: web
    name: sacco-web
    runtime: static
    plan: free
    rootDir: web-app
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set to the sacco-api URL, e.g. https://sacco-api.onrender.com/api/v1
      - key: VITE_API_URL
        value: https://CHANGE-ME.onrender.com/api/v1

databases:
  - name: sacco-db
    plan: free
